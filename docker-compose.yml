name: alertool

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # nginx la inyecta en X-Kiosk-Key para /api/alerts (no viaja al navegador)
      KIOSK_API_KEY: ${KIOSK_API_KEY:?KIOSK_API_KEY requerida}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Sin `ports`: solo nginx llega a la API (nada de :3000 expuesto).
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
    mem_limit: 512m
    logging: *default-logging

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    # Sin `ports`: la base solo es accesible desde la red interna de compose.
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER requerido}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?MONGO_PASS requerida}
      MONGO_INITDB_DATABASE: alert_system
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 768m
    logging: *default-logging

volumes:
  mongodb_data:
